[workspace]
resolver = "2"
members = [
    "crates/ruststack-core",
    "crates/ruststack-s3",
    "crates/ruststack-sqs",
    "crates/ruststack-sns",
    "crates/ruststack-eventbridge",
    "crates/ruststack-ssm",
    "crates/ruststack-secretsmanager",
    "crates/ruststack-sts",
    "crates/ruststack-dynamodb",
    "crates/ruststack-kms",
    "crates/ruststack-logs",
    "crates/ruststack-iam",
    "crates/ruststack-cloudwatch",
    "crates/ruststack-ses",
    "crates/ruststack-kinesis",
    "crates/ruststack-cognito",
    "crates/ruststack-apigateway",
    "crates/ruststack-route53",
    "crates/ruststack-stepfunctions",
    "crates/ruststack-cloudformation",
    "crates/ruststack-ecr",
    "crates/ruststack-ecs",
    "crates/ruststack-ec2",
    "crates/ruststack-elbv2",
    "crates/ruststack-bedrock",
    "crates/ruststack-opensearch",
    "crates/ruststack-athena",
    "crates/ruststack-rds",
    "crates/ruststack-elasticache",
    "crates/ruststack-redshift",
    "crates/ruststack-acm",
    "crates/ruststack-wafv2",
    "crates/ruststack-organizations",
    "crates/ruststack-server",
    "crates/ruststack-benchmarks",
    "crates/ruststack-compat-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["RustStack Contributors"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/ruststack/ruststack"
readme = "README.md"

[workspace.dependencies]
# Internal crates
ruststack-core = { path = "crates/ruststack-core" }
ruststack-s3 = { path = "crates/ruststack-s3" }
ruststack-sqs = { path = "crates/ruststack-sqs" }
ruststack-sns = { path = "crates/ruststack-sns" }
ruststack-eventbridge = { path = "crates/ruststack-eventbridge" }
ruststack-ssm = { path = "crates/ruststack-ssm" }
ruststack-secretsmanager = { path = "crates/ruststack-secretsmanager" }
ruststack-sts = { path = "crates/ruststack-sts" }
ruststack-dynamodb = { path = "crates/ruststack-dynamodb" }
ruststack-kms = { path = "crates/ruststack-kms" }
ruststack-logs = { path = "crates/ruststack-logs" }
ruststack-iam = { path = "crates/ruststack-iam" }
ruststack-cloudwatch = { path = "crates/ruststack-cloudwatch" }
ruststack-ses = { path = "crates/ruststack-ses" }
ruststack-kinesis = { path = "crates/ruststack-kinesis" }
ruststack-lambda = { path = "crates/ruststack-lambda" }
ruststack-cognito = { path = "crates/ruststack-cognito" }
ruststack-apigateway = { path = "crates/ruststack-apigateway" }
ruststack-route53 = { path = "crates/ruststack-route53" }
ruststack-stepfunctions = { path = "crates/ruststack-stepfunctions" }
ruststack-cloudformation = { path = "crates/ruststack-cloudformation" }
ruststack-ecr = { path = "crates/ruststack-ecr" }
ruststack-ecs = { path = "crates/ruststack-ecs" }
ruststack-ec2 = { path = "crates/ruststack-ec2" }
ruststack-elbv2 = { path = "crates/ruststack-elbv2" }
ruststack-bedrock = { path = "crates/ruststack-bedrock" }
ruststack-opensearch = { path = "crates/ruststack-opensearch" }
ruststack-athena = { path = "crates/ruststack-athena" }
ruststack-rds = { path = "crates/ruststack-rds" }
ruststack-elasticache = { path = "crates/ruststack-elasticache" }
ruststack-redshift = { path = "crates/ruststack-redshift" }
ruststack-acm = { path = "crates/ruststack-acm" }
ruststack-wafv2 = { path = "crates/ruststack-wafv2" }
ruststack-organizations = { path = "crates/ruststack-organizations" }
ruststack-server = { path = "crates/ruststack-server" }

# Async & HTTP runtime
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["tokio", "http2", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
bytes = "1.10"
http = "1.2"
http-body-util = "0.1"
hyper = { version = "1.5", features = ["full"] }

# Serialization & Formats
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.37", features = ["serialize"] }
form_urlencoded = "1.2"

# Utilities & Concurrency
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
dashmap = "6.1"
parking_lot = "0.12"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
regex = "1.11"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.5", features = ["derive", "env"] }
fastrand = "2.3"

# Dev & Benchmarks
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true
